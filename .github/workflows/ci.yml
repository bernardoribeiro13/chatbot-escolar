name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# One run per PR (or per branch on push); a new push to a PR cancels the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full git history with gitleaks
        # If git inside the container distrusts the repo ("dubious ownership"),
        # gitleaks scans 0 commits and still exits 0. Mark the mount as a safe
        # directory, and fail explicitly if no commits were scanned.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --verbose --no-color 2>&1 | tee gitleaks.log
          if grep -q ' 0 commits scanned' gitleaks.log; then
            echo "::error::gitleaks scanned 0 commits; the history was not checked."
            exit 1
          fi

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck on every tracked *.sh file
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh')
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Checking: %s\n' "${scripts[@]}"
          docker run --rm -v "$GITHUB_WORKSPACE:/mnt" -w /mnt "$SHELLCHECK_IMAGE" "${scripts[@]}"

  compose-config:
    name: compose-config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  db-smoke:
    name: db-smoke
    needs: compose-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Start Postgres and Redis
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run database smoke test
        run: bash tests/check-db.sh

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
