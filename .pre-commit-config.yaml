# Run `pre-commit autoupdate` to bump the pinned revisions to the latest releases.
# Ruff will be added once the repository has Python code.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env files (only .env.example is allowed)
        language: fail
        entry: "Do not commit .env files; only .env.example may be versioned:"
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'
